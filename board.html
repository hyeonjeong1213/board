
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>우리들의 방명록</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: #f5f6fa;
      color: #333;
      min-height: 100vh;
      padding: 50px 20px;
    }

    .container {
      max-width: 720px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    header .emoji {
      font-size: 45px;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #343a63;
    }

    header p {
      color: #888;
      font-size: 14px;
    }

    .write-box {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      margin-bottom: 30px;
    }

    .write-box h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #e1e3eb;
      border-radius: 9px;
      font-size: 14px;
      margin-bottom: 12px;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #7779db;
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }

    .input-info {
      display: flex;
      justify-content: space-between;
      color: #999;
      font-size: 12px;
      margin: -4px 0 15px;
    }

    button {
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #7779db;
      color: white;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #6264c2;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .list-header h2 {
      font-size: 19px;
    }

    .list-header span {
      color: #888;
      font-size: 13px;
    }

    .refresh-btn {
      background: white;
      border: 1px solid #ddd;
      padding: 8px 12px;
      border-radius: 7px;
      color: #555;
      margin-left: 8px;
    }

    .guestbook-item {
      background: white;
      padding: 20px;
      border-radius: 13px;
      margin-bottom: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.03);
    }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .writer {
      font-weight: bold;
      color: #555;
      font-size: 15px;
    }

    .date {
      color: #aaa;
      font-size: 12px;
    }

    .content {
      font-size: 14px;
      line-height: 1.7;
      color: #666;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      background: white;
      text-align: center;
      padding: 45px 20px;
      border-radius: 13px;
      color: #aaa;
      font-size: 14px;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 45px;
    }

    @media(max-width: 480px) {
      body {
        padding: 35px 15px;
      }

      header h1 {
        font-size: 25px;
      }

      .write-box {
        padding: 20px;
      }

      .date {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="emoji">💌</div>
      <h1>우리들의 방명록</h1>
      <p>소중한 메시지를 남겨주세요!</p>
    </header>

    <!-- 방명록 작성 -->
    <section class="write-box">
      <h2>✏️ 방명록 작성하기</h2>

      <input
        type="text"
        id="name"
        placeholder="닉네임을 입력해주세요."
        maxlength="20"
      >

      <textarea
        id="content"
        placeholder="따뜻한 메시지를 남겨주세요."
        maxlength="300"
      ></textarea>

      <div class="input-info">
        <span>최대 300자</span>
        <span id="charCount">0 / 300</span>
      </div>

      <button
        class="submit-btn"
        id="submitBtn"
        onclick="addGuestbook()"
      >
        방명록 남기기
      </button>
    </section>

    <!-- 방명록 목록 -->
    <section>

      <div class="list-header">
        <h2>📬 방명록 목록</h2>

        <div>
          <span id="totalCount">0개의 메시지</span>
          <button
            class="refresh-btn"
            onclick="loadGuestbook()"
          >
            ↻ 새로고침
          </button>
        </div>
      </div>

      <div id="guestbookList">
        <div class="empty">방명록을 불러오는 중입니다.</div>
      </div>

      <p class="status" id="status"></p>

    </section>

    <footer>
      Made with ❤️ using Google Apps Script
    </footer>

  </div>

  <script>

    // ===================================
    // GAS 웹 앱 URL 입력
    // ===================================

    const API_URL = 'https://script.google.com/macros/s/AKfycbw6KjYOxb86JU3uqKDlC7fW8mFOAhSGVK-GqhS766l6WaSW9ExOOIQF2E80IKsB2fvdZA/exec';

    // ===================================
    // JSONP 통신 함수
    // ===================================

    function callAPI(params) {
      return new Promise((resolve, reject) => {

        const callbackName =
          'guestbookCallback_' +
          Date.now() + '_' +
          Math.random().toString(36).slice(2);

        const script = document.createElement('script');

        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('서버 응답 시간이 초과되었습니다.'));
        }, 15000);

        function cleanup() {
          clearTimeout(timeout);
          delete window[callbackName];
          script.remove();
        }

        window[callbackName] = function(result) {
          cleanup();
          resolve(result);
        };

        const query = new URLSearchParams({
          ...params,
          callback: callbackName
        });

        script.src = API_URL + '?' + query.toString();

        script.onerror = function() {
          cleanup();
          reject(new Error('서버 연결에 실패했습니다.'));
        };

        document.body.appendChild(script);

      });
    }

    // ===================================
    // 방명록 목록 조회
    // ===================================

    async function loadGuestbook() {

      const list = document.getElementById('guestbookList');

      list.innerHTML =
        '<div class="empty">방명록을 불러오는 중입니다.</div>';

      try {

        const result = await callAPI({
          action: 'list'
        });

        if (!result.success) {
          throw new Error(result.message);
        }

        renderGuestbook(result.data);

        document.getElementById('totalCount').textContent =
          result.count + '개의 메시지';

        document.getElementById('status').textContent =
          '최신 방명록을 불러왔습니다.';

      } catch (error) {

        list.innerHTML =
          '<div class="empty">방명록을 불러오지 못했습니다.</div>';

        document.getElementById('status').textContent =
          error.message;

      }
    }

    // ===================================
    // 방명록 화면 출력
    // ===================================

    function renderGuestbook(data) {

      const list = document.getElementById('guestbookList');

      list.replaceChildren();

      if (!data || data.length === 0) {

        list.innerHTML =
          '<div class="empty">아직 작성된 방명록이 없습니다.<br>첫 번째 메시지를 남겨보세요! 💕</div>';

        return;
      }

      data.forEach(item => {

        const card = document.createElement('div');
        card.className = 'guestbook-item';

        const top = document.createElement('div');
        top.className = 'item-top';

        const writer = document.createElement('span');
        writer.className = 'writer';
        writer.textContent = '👤 ' + item.name;

        const date = document.createElement('span');
        date.className = 'date';
        date.textContent = item.date;

        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = item.content;

        top.appendChild(writer);
        top.appendChild(date);

        card.appendChild(top);
        card.appendChild(content);

        list.appendChild(card);

      });
    }

    // ===================================
    // 방명록 등록
    // ===================================

    async function addGuestbook() {

      const nameInput = document.getElementById('name');
      const contentInput = document.getElementById('content');
      const submitBtn = document.getElementById('submitBtn');

      const name = nameInput.value.trim();
      const content = contentInput.value.trim();

      if (!name) {
        alert('닉네임을 입력해주세요.');
        nameInput.focus();
        return;
      }

      if (!content) {
        alert('방명록 내용을 입력해주세요.');
        contentInput.focus();
        return;
      }

      if (name.length > 20) {
        alert('닉네임은 20자 이하로 입력해주세요.');
        return;
      }

      if (content.length > 300) {
        alert('내용은 300자 이하로 입력해주세요.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '등록 중...';

      try {

        const result = await callAPI({
          action: 'add',
          name: name,
          content: content
        });

        if (!result.success) {
          throw new Error(result.message);
        }

        alert('방명록이 등록되었습니다! 💌');

        nameInput.value = '';
        contentInput.value = '';

        document.getElementById('charCount').textContent =
          '0 / 300';

        await loadGuestbook();

      } catch (error) {

        alert('등록 실패: ' + error.message);

      } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = '방명록 남기기';

      }
    }

    // ===================================
    // 글자 수 표시
    // ===================================

    document.getElementById('content')
      .addEventListener('input', function() {

        document.getElementById('charCount').textContent =
          this.value.length + ' / 300';

      });

    // ===================================
    // 페이지 최초 실행
    // ===================================

    loadGuestbook();

    // 30초마다 자동 새로고침
    setInterval(loadGuestbook, 30000);

  </script>

</body>
</html>
